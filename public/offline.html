<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1626" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)" />
  <title>MĪZAN — Offline</title>
  <!-- Palette must track index.html's first-paint block and THEME_CSS. It did
       not: this page was still on the pre-rebrand terminal palette — a dark
       green-black canvas (#0d1311) and the old gold accent (#c9a24b) that
       CLAUDE.md §5 retired in favour of navy on 2026-06-24. So the one screen a
       user sees when the app is failing was the one screen that looked like a
       different product. Light is the default face; dark follows the OS, since
       an offline page cannot read the app's stored theme preference. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #faf8f4;        /* paper canvas */
      --text-hi: #1c1b19;   /* ink */
      --muted: #6b7b88;     /* slate */
      --accent: #1e4e8c;    /* navy — the brand accent */
      --on-accent: #faf8f4;
      --surface: #ffffff;
      --border: rgba(28,27,25,0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1626;      /* midnight navy */
        --text-hi: #f4f2ec; /* warm ivory */
        --muted: #8fa0b5;
        --accent: #5b8fd4;  /* navy lifts for contrast on the dark canvas */
        --on-accent: #0e1626;
        --surface: rgba(255,255,255,0.04);
        --border: rgba(244,242,236,0.14);
      }
    }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text-hi);
      font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      /* Safe-area padding so the card clears the notch and home indicator when
         this renders inside an installed PWA. */
      padding: calc(2rem + env(safe-area-inset-top, 0px)) 1.5rem
               calc(2rem + env(safe-area-inset-bottom, 0px));
      text-align: center;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .mark { width: 56px; height: 56px; display: block; }
    .wordmark {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text-hi);
      font-family: 'Fraunces', Georgia, serif;
    }
    h1 { font-size: 1.125rem; font-weight: 600; color: var(--text-hi); }
    p {
      font-size: 0.9375rem;
      color: var(--muted);
      max-width: 24rem;
      line-height: 1.6;
    }
    button {
      margin-top: 0.25rem;
      /* 44px minimum — this button is the entire point of the page. */
      min-height: 44px;
      padding: 0.625rem 1.75rem;
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.04em;
      font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    }
    button:active { transform: translateY(1px); }
    .hint {
      margin-top: 0.5rem;
      font-size: 0.8125rem;
      color: var(--muted);
      max-width: 24rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <img src="/mark.png" alt="" class="mark" width="56" height="56" />
  <div class="wordmark">MĪZAN</div>
  <h1>You're offline</h1>
  <p>Your holdings, Zakat worksheet and goals are safe — they just need a connection to refresh.</p>
  <button onclick="window.location.reload()">Try again</button>
  <p class="hint">Cached pages still open. Live prices, screening and sync resume automatically once you're back online.</p>
</body>
</html>
