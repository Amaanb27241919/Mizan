<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `user-scalable=no` was removed 2026-08-14: it blocks pinch-zoom, which
         is a WCAG 1.4.4 failure and a real problem in an app whose densest
         surfaces are numeric tables. It was there to stop iOS auto-zooming on
         input focus, but THEME_CSS already solves that the correct way, by
         forcing form controls to 16px. `interactive-widget=resizes-content`
         makes the on-screen keyboard shrink the viewport instead of covering
         it, so the Assistant's composer stays visible while typing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="MĪZAN — Shariah-compliant investment super-app. Screen, automate, and compound." />
    <meta name="theme-color" content="#0e1626" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS uses 180x180 on @3x devices; serving that exact size avoids a
         resample. The file is fully opaque (verified) — iOS flattens any alpha
         onto BLACK, which would have turned the navy mark into mud. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default`, NOT `black-translucent`. Two reasons, both concrete:
         (1) black-translucent forces the status bar's clock, battery and signal
             to render in WHITE and gives them the page background — and Mizan's
             default face is the paper canvas (#faf8f4). White on near-white
             meant an invisible status bar for every light-theme user on an
             installed iOS app. iOS has no dynamic contrast for this.
         (2) Apple has deprecated the black-translucent value; support is slated
             for removal.
         `default` gives dark status text and starts the web view below the bar.
         The safe-area padding elsewhere degrades cleanly — env(safe-area-inset-
         top) simply resolves to 0 when the viewport no longer extends up there. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MĪZAN" />

    <!-- iOS launch images. Android needs no equivalent — Chrome synthesises a
         splash from the manifest's background_color + icon. iOS synthesises
         nothing, so without these an installed Mizan shows a blank WHITE screen
         from tap until React paints. Safari only accepts an image whose media
         query matches the device exactly, hence the matrix.
         Generated by scripts/generate-ios-splash.mjs — do not hand-edit; re-run
         it (and `--check` in CI) when adding a device or changing the palette.
         Portrait only: covering landscape would double this for a case that
         barely happens, and it degrades to the plain background, not a break.
         The dark variants key off prefers-color-scheme, which follows the
         SYSTEM appearance while Mizan's theme lives in localStorage — so a user
         forcing the app dark on a light phone still gets the light splash. That
         is unavoidable; generating both still fixes the common case. -->
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: light) and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/375x667@2-light.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: light) and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/414x736@3-light.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: light) and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/375x812@3-light.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: light) and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/414x896@2-light.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: light) and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/414x896@3-light.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: light) and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/390x844@3-light.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: light) and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/428x926@3-light.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: light) and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/393x852@3-light.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: light) and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/430x932@3-light.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: light) and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/402x874@3-light.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: light) and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/440x956@3-light.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: dark) and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/375x667@2-dark.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: dark) and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/414x736@3-dark.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: dark) and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/375x812@3-dark.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: dark) and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/414x896@2-dark.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: dark) and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/414x896@3-dark.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: dark) and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/390x844@3-dark.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: dark) and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/428x926@3-dark.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: dark) and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/393x852@3-dark.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: dark) and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/430x932@3-dark.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: dark) and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/402x874@3-dark.png" />
    <link rel="apple-touch-startup-image" media="(prefers-color-scheme: dark) and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/440x956@3-dark.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Fonts. The app's real families (Fraunces / IBM Plex Sans / IBM Plex
         Mono) are @imported by THEME_CSS in MizanApp.jsx; these preconnects
         warm that connection. The Sora + JetBrains Mono stylesheet that used to
         load here was removed 2026-08-10: Sora is used nowhere in the app, and
         JetBrains Mono only ever appears as a fallback BEHIND IBM Plex Mono in
         the FM stacks — with Menlo/Monaco (system, zero-latency) right after
         it. Downloading two whole families render-blocking to serve a fallback
         that a system font already covers is pure cost. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>MĪZAN — Halal Investment Terminal</title>

    <!-- Resolve the theme BEFORE first paint. Without this the bootstrap CSS
         below has to guess, and whichever it guesses is a flash for everyone
         else. Mirrors MizanApp.jsx: localStorage `mizan_theme_mode`, default
         "light", "auto" defers to the OS. Kept tiny and fail-safe — a throwing
         localStorage (Safari private mode) must not block the app booting. -->
    <script>
      try {
        var m = localStorage.getItem('mizan_theme_mode') || 'light';
        var dark = m === 'dark' || (m === 'auto' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    </script>

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      /* Mobile-correct viewport height. Declared here as well as in THEME_CSS
         so the surfaces that render OUTSIDE MizanApp — Login, the legal pages,
         the error boundary — get it too. `100vh` on a phone is the URL-bar-
         retracted height, so a 100vh box is always taller than what's on
         screen; `dvh` tracks the real one. */
      :root { --mz-vh: 100vh; }
      @supports (height: 100dvh) { :root { --mz-vh: 100dvh; } }
      /* The fluid type tokens must exist at FIRST PAINT, not only once React
         injects THEME_CSS. Until that <style> is parsed every
         `font-size: var(--fs-*)` is invalid and the browser falls back to
         16px, so the header rendered ~30% wider and briefly overflowed a
         320px viewport. Keep these in sync with THEME_CSS in MizanApp.jsx —
         they are the same scale, duplicated only so the very first frame is
         correct. */
      :root {
        --fs-2xs: clamp(0.6875rem, 0.6696rem + 0.08929vw, 0.75rem);
        --fs-xs:  clamp(0.7188rem, 0.692rem  + 0.1339vw,  0.8125rem);
        --fs-sm:  clamp(0.75rem,   0.7143rem + 0.1786vw,  0.875rem);
        --fs-md:  clamp(0.8125rem, 0.7768rem + 0.1786vw,  0.9375rem);
        --fs-lg:  clamp(0.875rem,  0.8393rem + 0.1786vw,  1rem);
        --fs-xl:  clamp(1rem,      0.9464rem + 0.2679vw,  1.188rem);
        --fs-2xl: clamp(1.125rem,  1.054rem  + 0.3571vw,  1.375rem);
        --fs-3xl: clamp(1.375rem,  1.304rem  + 0.3571vw,  1.625rem);
        --fs-4xl: clamp(1.625rem,  1.518rem  + 0.5357vw,  2rem);
        --fs-5xl: clamp(1.875rem,  1.696rem  + 0.8929vw,  2.5rem);
        --fs-6xl: clamp(2.125rem,  1.804rem  + 1.607vw,   3.25rem);
      }
      /* First-paint colors. These MUST track --mz-bg / --mz-textHi in
         MizanApp.jsx THEME_CSS — they are what the user stares at between the
         HTML arriving and React mounting. They used to be #07080E on #C8CCE4,
         a near-black left over from the old terminal-era design, so every cold
         load (and every PWA launch) flashed black before painting the paper
         canvas. */
      html, body, #root {
        height: 100%;
        background: #faf8f4;
        color: #1c1b19;
        font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root { background: #0e1626; color: #f4f2ec; }

      ::-webkit-scrollbar { width: 4px; height: 4px; background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d2cabb; border-radius: 2px; }
      html[data-theme="dark"] ::-webkit-scrollbar-thumb { background: #3d4f70; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
